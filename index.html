.tag{display:inline-block;font-size:.8rem;color:var(--main);border:1px solid var(--main);border-radius:12px;padding:0 8px;margin-right:4px}
.btn{background:#1F4E79;color:#fff;text-decoration:none;padding:8px 16px;border-radius:8px;font-weight:600;white-space:nowrap}
.btns{display:flex;gap:8px}
.btn.alt{background:transparent;color:var(--main);border:1px solid var(--main)}
.empty{text-align:center;color:var(--muted);padding:30px}
footer{text-align:center;color:var(--muted);padding:20px 10px 30px;font-size:.95rem}

const $ = id => document.getElementById(id);
const uniq = k => [...new Set(DE.map(d => d[k]))].sort();
uniq("khoi").forEach(v => $("fGrade").add(new Option(v, v)));
uniq("loai").forEach(v => $("fType").add(new Option(v, v)));
uniq("nam").reverse().forEach(v => $("fYear").add(new Option("Năm học " + v, v)));

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  const q = $("q").value.trim().toLowerCase();
  const g = $("fGrade").value, t = $("fType").value, y = $("fYear").value;
  const rows = DE.filter(d =>
    (!g || d.khoi === g) && (!t || d.loai === t) && (!y || d.nam === y) &&
    (!q || [d.ten,d.truong,d.nam,d.khoi,d.loai].join(" ").toLowerCase().includes(q))
  );
  $("list").innerHTML = rows.length ? rows.map(d => `
    <div class="item">
      <div>
        <h3>${esc(d.ten)}</h3>
        <span class="tag">${esc(d.truong)}</span><span class="tag">${esc(d.khoi)}</span>
        <span class="tag">${esc(d.loai)}</span><span class="tag">${esc(d.nam)}</span>
      </div>
      <div class="btns">
        ${d.pdf ? `<a class="btn alt" href="${esc(d.pdf)}" target="_blank" rel="noopener">Xem PDF</a>` : ""}
        ${d.file ? `<a class="btn" href="${esc(d.file)}" download>Tải Word</a>` : ""}
      </div>
    </div>`).join("") : '<div class="empty">Chưa có đề phù hợp.</div>';
}
["q","fGrade","fType","fYear"].forEach(id => $(id).addEventListener("input", render));
render();
